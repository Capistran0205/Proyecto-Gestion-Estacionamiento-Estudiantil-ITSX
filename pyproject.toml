[project]
name = "proyecto-gestion-de-estacionamiento-estudiantil"
version = "0.1.0"
description = "App móvil de gestión de estacionamiento estudiantil (Flet + MVVM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=1.0.1",
    "paho-mqtt>=2.1.0",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "flet-desktop>=1.0.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parking_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
