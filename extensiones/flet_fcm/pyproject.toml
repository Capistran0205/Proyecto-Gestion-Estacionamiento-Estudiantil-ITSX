[project]
name = "flet-fcm"
version = "0.1.0"
description = "Extensión de Flet para Firebase Cloud Messaging (notificaciones push en Android)"
requires-python = ">=3.12"
dependencies = ["flet==1.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# La carpeta flutter/ viaja en el wheel junto al paquete de Python: `flet build` la
# detecta (como con flet-camera) y la agrega al proyecto de Flutter.
[tool.hatch.build.targets.wheel]
packages = ["src/flet_fcm"]

[tool.hatch.build.targets.wheel.force-include]
"src/flutter" = "flutter"
